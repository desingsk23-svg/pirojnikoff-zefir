<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пирожникофф — зефир в шоколаде</title>
  <link rel="preload" href="assets/fonts/aa_bebasneue.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
</head>
<body>
  <div class="loader" id="loader"><span></span></div>

  <main>
    <!-- 6 экранов в одной закреплённой сцене: клубника 1–3 → смена вкуса → фисташка 1–3 -->
    <section class="scene" id="scene">
      <div class="sticky" id="sticky">
        <!-- слои вкусов (фон и элементы за пачкой) собираются из main.js -->
        <canvas id="gl"></canvas>
        <!-- слои вкусов (элементы перед пачкой и тексты) собираются из main.js -->

        <div class="ui stage-ui">
          <div class="stage">
            <header class="header" id="header">
              <div class="logo" id="logo"></div>
              <button class="btn btn-outline" id="flavorBtn" type="button">
                <span>Выбрать вкус</span><span class="arrow">→</span>
              </button>
            </header>
          </div>
        </div>

        <div class="progress" id="progress" aria-hidden="true"></div>
      </div>
    </section>

    <section class="credits">
      3D-модель пакета: «Chip Bag», M. Visual (Sketchfab), CC-BY 4.0
    </section>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
